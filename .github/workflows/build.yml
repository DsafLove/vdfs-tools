name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get install -y --no-install-recommends build-essential perl

      - name: Build dependencies (openssl / zlib / lzo)
        run: make openssl zlib lzo

      - name: Build VDFS tools
        run: make all

      - name: Strip binaries
        run: strip mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vdfs-tools-linux-x86_64
          path: |
            mkfs.vdfs
            unpack.vdfs
            tune.vdfs
            fsck.vdfs
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vdfs-tools-linux-x86_64

      - name: Package binaries
        run: |
          chmod +x mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs
          tar -czf vdfs-tools-linux-x86_64-${{ github.ref_name }}.tar.gz \
            mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vdfs-tools-linux-x86_64-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
