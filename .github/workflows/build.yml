name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@1.4.4
        with:
          healthchecks: 10
          speedtests: 2
          parallel: 2
          sample-size: 1024
          sample-time: 2
          exclude-current: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential perl

      - name: Build dependencies (openssl / zlib / lzo)
        run: make openssl zlib lzo

      - name: Build VDFS tools
        run: make all

      - name: Strip binaries
        run: strip mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdfs-tools-linux-x86_64
          path: |
            mkfs.vdfs
            unpack.vdfs
            tune.vdfs
            fsck.vdfs
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vdfs-tools-linux-x86_64

      - name: Package binaries
        run: |
          chmod +x mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs
          tar -czf vdfs-tools-linux-x86_64-${{ github.ref_name }}.tar.gz \
            mkfs.vdfs unpack.vdfs tune.vdfs fsck.vdfs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: vdfs-tools-linux-x86_64-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
